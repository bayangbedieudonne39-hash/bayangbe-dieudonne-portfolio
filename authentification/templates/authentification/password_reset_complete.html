<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portail BAYANGBE - Mot de Passe Modifié</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Roboto', sans-serif; }
        body {
            background-color: #030712; color: #ffffff; height: 100vh;
            display: flex; justify-content: center; align-items: center; overflow: hidden; position: relative;
        }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        .portal-container {
            position: relative; z-index: 2; background: rgba(8, 15, 30, 0.9);
            border: 2px solid #00d2ff; box-shadow: 0 0 30px rgba(0, 210, 255, 0.4);
            padding: 40px; width: 100%; max-width: 450px; border-radius: 12px; backdrop-filter: blur(8px);
            text-align: center;
        }
        .portal-header { margin-bottom: 25px; }
        .portal-header h1 {
            color: #00d2ff; font-size: 24px; letter-spacing: 3px;
            text-transform: uppercase; text-shadow: 0 0 12px rgba(0, 210, 255, 0.8);
        }
        .portal-header p { color: #94a3b8; font-size: 12px; letter-spacing: 1.5px; margin-top: 5px; }
        .success-box {
            color: #38bdf8; font-size: 14px; line-height: 1.6; margin-bottom: 30px;
            background: rgba(0, 210, 255, 0.08); padding: 15px; border-radius: 6px; border: 1px solid #00d2ff;
        }
        .btn-login {
            display: inline-block; width: 100%; padding: 13px; background: linear-gradient(135deg, #00d2ff, #2563eb);
            border: none; border-radius: 6px; color: #ffffff; font-size: 15px; font-weight: 700;
            cursor: pointer; text-transform: uppercase; letter-spacing: 1.5px; text-decoration: none;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.4); transition: all 0.3s ease;
        }
        .btn-login:hover { background: linear-gradient(135deg, #2563eb, #00d2ff); box-shadow: 0 0 20px rgba(0, 210, 255, 0.8); }

        @media (max-width: 480px) {
            .portal-container { padding: 20px; max-width: 90%; }
        }
    </style>
</head>
<body>
    <canvas id="matrixCanvas"></canvas>
    <div class="portal-container">
        <div class="portal-header">
            <h1>BAYANGBE</h1>
            <p>[ OPÉRATION RÉUSSIE ]</p>
        </div>

        <div class="success-box">
            Votre mot de passe a été modifié avec succès. Vous pouvez désormais vous connecter au portail avec vos nouveaux identifiants.
        </div>

        <a href="{% url 'login' %}" class="btn-login">Se connecter</a>
    </div>

    <script>
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');
        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        const binaryChars = '01'; const fontSize = 16;
        let columns = Math.floor(canvas.width / fontSize); let drops = [];
        for (let i = 0; i < columns; i++) { drops[i] = 1; }
        function drawMatrix() {
            ctx.fillStyle = 'rgba(3, 7, 18, 0.08)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.font = fontSize + 'px monospace';
            for (let i = 0; i < drops.length; i++) {
                const text = binaryChars.charAt(Math.floor(Math.random() * binaryChars.length));
                ctx.fillStyle = Math.random() > 0.85 ? '#ffffff' : '#00d2ff';
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) { drops[i] = 0; }
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 40);
    </script>
</body>
</html>
