<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portail BAYANGBE - Nouveau Mot de Passe</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Roboto', sans-serif; }
        body {
            background-color: #030712; color: #ffffff; height: 100vh;
            display: flex; justify-content: center; align-items: center; overflow: hidden; position: relative;
        }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        .portal-container {
            position: relative; z-index: 2; background: rgba(8, 15, 30, 0.9);
            border: 2px solid #00d2ff; box-shadow: 0 0 30px rgba(0, 210, 255, 0.4);
            padding: 40px; width: 100%; max-width: 450px; border-radius: 12px; backdrop-filter: blur(8px);
        }
        .portal-header { text-align: center; margin-bottom: 25px; }
        .portal-header h1 {
            color: #00d2ff; font-size: 24px; letter-spacing: 3px;
            text-transform: uppercase; text-shadow: 0 0 12px rgba(0, 210, 255, 0.8);
        }
        .portal-header p { color: #94a3b8; font-size: 12px; letter-spacing: 1.5px; margin-top: 5px; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 6px; font-size: 12px; color: #e2e8f0; text-transform: uppercase; }
        .form-group input {
            width: 100%; padding: 12px 14px; background: rgba(2, 6, 23, 0.95);
            border: 1px solid #1e3a8a; border-radius: 6px; color: #ffffff; font-size: 14px;
            transition: all 0.3s ease;
        }
        .form-group input:focus { outline: none; border-color: #00d2ff; box-shadow: 0 0 10px rgba(0, 210, 255, 0.5); }
        .helptext { font-size: 11px; color: #64748b; margin-top: 4px; display: block; }
        .errorlist { list-style: none; color: #f87171; font-size: 11px; margin-top: 4px; }

        .btn-submit {
            width: 100%; padding: 13px; background: linear-gradient(135deg, #00d2ff, #2563eb);
            border: none; border-radius: 6px; color: #ffffff; font-size: 15px; font-weight: 700;
            cursor: pointer; text-transform: uppercase; letter-spacing: 1.5px; margin-top: 15px;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.4); transition: all 0.3s ease;
        }
        .btn-submit:hover { background: linear-gradient(135deg, #2563eb, #00d2ff); box-shadow: 0 0 20px rgba(0, 210, 255, 0.8); }
        
        .portal-footer { margin-top: 20px; text-align: center; font-size: 13px; }
        .portal-footer a { color: #60a5fa; text-decoration: none; }
        .portal-footer a:hover { color: #00d2ff; text-decoration: underline; }

        @media (max-width: 480px) {
            .portal-container { padding: 20px; max-width: 90%; }
        }
    </style>
</head>
<body>
    <canvas id="matrixCanvas"></canvas>
    <div class="portal-container">
        <div class="portal-header">
            <h1>BAYANGBE</h1>
            <p>[ RÉINITIALISATION DU MOT DE PASSE ]</p>
        </div>

        <form method="POST">
            {% csrf_token %}
            {% for field in form %}
                <div class="form-group">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% if field.help_text %}
                        <span class="helptext">{{ field.help_text|safe }}</span>
                    {% endif %}
                    {{ field.errors }}
                </div>
            {% endfor %}
            <button type="submit" class="btn-submit">Changer le mot de passe</button>
        </form>

        <div class="portal-footer">
            <a href="{% url 'login' %}">Annuler et retourner à la connexion</a>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');
        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        const binaryChars = '01'; const fontSize = 16;
        let columns = Math.floor(canvas.width / fontSize); let drops = [];
        for (let i = 0; i < columns; i++) { drops[i] = 1; }
        function drawMatrix() {
            ctx.fillStyle = 'rgba(3, 7, 18, 0.08)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.font = fontSize + 'px monospace';
            for (let i = 0; i < drops.length; i++) {
                const text = binaryChars.charAt(Math.floor(Math.random() * binaryChars.length));
                ctx.fillStyle = Math.random() > 0.85 ? '#ffffff' : '#00d2ff';
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) { drops[i] = 0; }
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 40);
    </script>
</body>
</html>
